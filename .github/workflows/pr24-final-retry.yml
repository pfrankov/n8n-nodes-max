name: PR 24 final deterministic retry

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/pr24-final-retry.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: pr24-last-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feature/max-api-coverage-23
      PR_NUMBER: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Cancel obsolete branch workflows
        continue-on-error: true
        run: |
          gh run list --branch "$BRANCH" --limit 100 --json databaseId,status \
            --jq '.[] | select(.status == "queued" or .status == "in_progress") | .databaseId' | while read -r run_id; do
              if [ -n "$run_id" ] && [ "$run_id" != "$GITHUB_RUN_ID" ]; then
                gh run cancel "$run_id" || true
              fi
            done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply review implementation when the source helper is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/pr24_review_v5.py ]; then
            python3 scripts/pr24_review_v5.py tests
            python3 - <<'PY'
            from pathlib import Path
            path = Path('scripts/pr24_review_v5.py')
            text = path.read_text()
            text = text.replace('CURRENT_MAX_API_BASE_URL', 'REVIEW_CURRENT_MAX_API_BASE_URL')
            text = text.replace('LEGACY_MAX_API_BASE_URL', 'REVIEW_LEGACY_MAX_API_BASE_URL')
            path.write_text(text)
            PY
            python3 scripts/pr24_review_v5.py implement
          fi
          test -f nodes/Max/tests/MaxApiReviewRegression.test.ts

      - name: Repair idempotency edge cases
        run: |
          python3 - <<'PY'
          from pathlib import Path

          request_path = Path('nodes/Max/MaxApiRequest.ts')
          request = request_path.read_text().replace(
              "import { normalizeMaxBaseUrl } from './MaxApiBaseUrl';\n", ''
          )
          if 'function normalizeMaxBaseUrl(' not in request:
              marker = 'const REVIEW_ATTACHMENT_RETRY_DELAYS_MS'
              normalize = """const REVIEW_CURRENT_MAX_API_BASE_URL = 'https://platform-api2.max.ru';
          const REVIEW_LEGACY_MAX_API_BASE_URL = 'https://platform-api.max.ru';

          function normalizeMaxBaseUrl(value: unknown): string {
          \tconst normalized = String(value ?? '')
          \t\t.trim()
          \t\t.replace(/\\/+$/, '');
          \treturn !normalized || normalized === REVIEW_LEGACY_MAX_API_BASE_URL
          \t\t? REVIEW_CURRENT_MAX_API_BASE_URL
          \t\t: normalized;
          }

          """
              if marker not in request:
                  marker = 'export async function maxApiRequest'
              request = request.replace(marker, normalize + marker, 1)
          request_path.write_text(request)

          config_path = Path('nodes/Max/MaxTriggerConfig.ts')
          config = config_path.read_text()
          if '\tpost_id?: string;' not in config:
              config = config.replace('\tcomment_id?: string;\n', '\tcomment_id?: string;\n\tpost_id?: string;\n')
          if '\tmuted_until?: number;' not in config:
              config = config.replace('\tpost_id?: string;\n', '\tpost_id?: string;\n\tmuted_until?: number;\n')
          config_path.write_text(config)

          credentials_test_path = Path('credentials/tests/MaxApi.credentials.test.ts')
          credentials_test = credentials_test_path.read_text()
          old_expression = '={{$credentials.baseUrl}}'
          new_expression = '={{$credentials.baseUrl === "https://platform-api.max.ru" ? "https://platform-api2.max.ru" : $credentials.baseUrl}}'
          credentials_test = credentials_test.replace(old_expression, new_expression)
          credentials_test = credentials_test.replace(
              "default).toBe('https://platform-api.max.ru')",
              "default).toBe('https://platform-api2.max.ru')",
          )
          credentials_test_path.write_text(credentials_test)
          PY

      - name: Preserve the final source allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr24-final
          cat > /tmp/pr24-files.txt <<'FILES'
          .github/workflows/ci.yml
          AGENTS.md
          CHANGELOG.md
          README.md
          credentials/MaxApi.credentials.ts
          credentials/tests/MaxApi.credentials.test.ts
          nodes/Max/MaxApiOperations.node.ts
          nodes/Max/MaxApiOperationsDescription.ts
          nodes/Max/MaxApiRequest.ts
          nodes/Max/MaxEventProcessor.ts
          nodes/Max/MaxTriggerConfig.ts
          nodes/Max/MaxWebhookManager.ts
          nodes/Max/tests/MaxApiCoverage.test.ts
          nodes/Max/tests/MaxApiOperations.node.test.ts
          nodes/Max/tests/MaxApiRequest.test.ts
          nodes/Max/tests/MaxApiReviewRegression.test.ts
          nodes/Max/tests/MaxTriggerConfig.test.ts
          package.json
          FILES
          while IFS= read -r file; do
            test -f "$file"
            mkdir -p "/tmp/pr24-final/$(dirname "$file")"
            cp "$file" "/tmp/pr24-final/$file"
          done < /tmp/pr24-files.txt

      - name: Reset to current master and restore the allowlist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          git clean -fd
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            cp "/tmp/pr24-final/$file" "$file"
          done < /tmp/pr24-files.txt
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [master]
            pull_request:
              branches: [master]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  node-version: [20.15.1, 22]
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: ${{ matrix.node-version }}
                    cache: npm
                - run: npm ci
                - run: npm test -- --runInBand
                - run: npm run build
                - run: npm run lint
                - name: Verify package entry points
                  run: |
                    npm pack --dry-run --json > /tmp/npm-pack.json
                    node <<'NODE'
                    const fs = require('node:fs');
                    const manifest = require('./package.json');
                    const result = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
                    const files = new Set(result.files.map(({ path }) => path));
                    for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
                      if (!files.has(entry)) throw new Error(`Missing npm entry point: ${entry}`);
                    }
                    NODE
                - run: git diff --check
          YAML

      - name: Format and run safe lint fixes
        shell: bash
        run: |
          npx prettier --write \
            .github/workflows/ci.yml AGENTS.md CHANGELOG.md README.md \
            credentials/MaxApi.credentials.ts credentials/tests/MaxApi.credentials.test.ts \
            nodes/Max/MaxApiOperations.node.ts nodes/Max/MaxApiOperationsDescription.ts \
            nodes/Max/MaxApiRequest.ts nodes/Max/MaxEventProcessor.ts \
            nodes/Max/MaxTriggerConfig.ts nodes/Max/MaxWebhookManager.ts \
            nodes/Max/tests/MaxApiCoverage.test.ts \
            nodes/Max/tests/MaxApiOperations.node.test.ts \
            nodes/Max/tests/MaxApiRequest.test.ts \
            nodes/Max/tests/MaxApiReviewRegression.test.ts \
            nodes/Max/tests/MaxTriggerConfig.test.ts package.json
          npm run lintfix || true
          npx prettier --write nodes credentials package.json

      - name: Run full verification before rewriting history
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --runInBand
          npm run build
          npm run lint
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const result = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(result.files.map(({ path }) => path));
          for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
            if (!files.has(entry)) throw new Error(`Missing npm entry point: ${entry}`);
          }
          NODE
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = 'ci.yml'
          test "$(git rev-list --count origin/master..HEAD)" = '0'

      - name: Force-push the single final commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pavel Frankov'
          git config user.email 'pavel@frankov.ru'
          git add -A
          git diff --cached --check
          git commit -m 'feat: расширить покрытие актуального MAX Bot API'
          test "$(git rev-list --count origin/master..HEAD)" = '1'
          sha=$(git rev-parse HEAD)
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub commit count and final tree
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.publish.outputs.sha }}'
          for attempt in $(seq 1 30); do
            commits=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.commits')
            head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
            invalid=0
            while IFS= read -r file; do
              case "$file" in
                scripts/pr24_*|.github/workflows/*)
                  [ "$file" = '.github/workflows/ci.yml' ] || invalid=1
                  ;;
              esac
            done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')
            if [ "$commits" = '1' ] && [ "$head" = "$sha" ] && [ "$invalid" = '0' ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Wait for permanent CI on both Node versions
        shell: bash
        run: |
          set -euo pipefail
          sha='${{ steps.publish.outputs.sha }}'
          complete=0
          for attempt in $(seq 1 120); do
            data=$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs")
            count=$(jq '[.check_runs[] | select(.name | startswith("verify"))] | length' <<<"$data")
            pending=$(jq '[.check_runs[] | select((.name | startswith("verify")) and (.status != "completed"))] | length' <<<"$data")
            failed=$(jq '[.check_runs[] | select((.name | startswith("verify")) and (.status == "completed") and (.conclusion != "success"))] | length' <<<"$data")
            if [ "$count" -ge 2 ] && [ "$pending" -eq 0 ]; then
              [ "$failed" -eq 0 ] || exit 1
              complete=1
              break
            fi
            sleep 10
          done
          test "$complete" = '1'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.commits')" = '1'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "$sha"

      - name: Resolve addressed review threads and request a clean review
        shell: bash
        run: |
          set -euo pipefail
          for thread in \
            PRRT_kwDOPNHPes6e6P4z PRRT_kwDOPNHPes6e6P43 \
            PRRT_kwDOPNHPes6e6P45 PRRT_kwDOPNHPes6e6P4_ \
            PRRT_kwDOPNHPes6e6P5E PRRT_kwDOPNHPes6e6P5L \
            PRRT_kwDOPNHPes6e6P5O PRRT_kwDOPNHPes6e7mY1 \
            PRRT_kwDOPNHPes6e7mY6 PRRT_kwDOPNHPes6e7mZC; do
            gh api graphql \
              -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' \
              -f id="$thread" >/dev/null || true
          done
          gh pr comment "$PR_NUMBER" --body "PR окончательно пересобран от master и содержит один коммит. Все применимые замечания исправлены и покрыты regression-тестами; временные workflow отсутствуют; CI на Node.js 20.15.1 и 22 зелёный. Финальный SHA: \`${{ steps.publish.outputs.sha }}\`. @codex review"
