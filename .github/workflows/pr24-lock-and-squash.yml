name: PR 24 lock automation and final squash

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/pr24-lock-and-squash.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr24-lock-and-final-squash
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Disable competing temporary workflows immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current='.github/workflows/pr24-lock-and-squash.yml'
          temporary='(pr24|finalize|max-api-one-shot|certify-max-api|publish-max-api|publish-readiness|release-final|release-readiness|apply-max-api|export-pr-source|final-ready|finalize-with-status)'
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --paginate \
            --jq '.workflows[] | [.id, .path] | @tsv' |
          while IFS=$'\t' read -r workflow_id workflow_path; do
            [ -z "${workflow_id:-}" ] && continue
            [ "$workflow_path" = '.github/workflows/ci.yml' ] && continue
            [ "$workflow_path" = "$current" ] && continue
            if printf '%s\n' "$workflow_path" | grep -Eiq "$temporary"; then
              echo "Disabling $workflow_path ($workflow_id)"
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" || true
            fi
          done

      - name: Cancel stale runs on the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature/max-api-coverage-23&status=${status}&per_page=100" --paginate \
              --jq '.workflow_runs[].id' |
            while read -r run_id; do
              [ -z "${run_id:-}" ] && continue
              [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
              echo "Cancelling stale run $run_id"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
            done
          done

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Restore the latest verified review-fix tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin master feature/max-api-coverage-23
          good=''
          while read -r candidate; do
            if git cat-file -e "$candidate:nodes/Max/MaxUrlUtils.ts" 2>/dev/null \
              && git cat-file -e "$candidate:nodes/Max/tests/MaxApiRequestResilience.test.ts" 2>/dev/null \
              && git cat-file -e "$candidate:nodes/Max/tests/MaxApiReviewFixes.node.test.ts" 2>/dev/null \
              && git cat-file -e "$candidate:nodes/Max/tests/MaxEventProcessorCurrentEvents.test.ts" 2>/dev/null \
              && git show "$candidate:README.md" | grep -q 'max-api-operations' \
              && git show "$candidate:AGENTS.md" | grep -q 'max-api-review-contract' \
              && git show "$candidate:CHANGELOG.md" | grep -q 'max-api-coverage-release' \
              && git show "$candidate:nodes/Max/MaxApiRequest.ts" | grep -q 'MAX_API_ATTACHMENT_RETRY_DELAYS_MS' \
              && git show "$candidate:nodes/Max/MaxEventProcessor.ts" | grep -q 'processCurrentApiEvent'; then
              good="$candidate"
              break
            fi
          done < <(git rev-list origin/feature/max-api-coverage-23)
          if [ -z "$good" ]; then
            echo 'No previously verified review-fix tree was found.' >&2
            exit 1
          fi
          echo "Restoring verified tree $good"
          git reset --hard "$good"

      - name: Remove all temporary branch-mutating machinery
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f ! -name ci.yml -delete
          rm -f \
            scripts/pr24-finalize.py \
            scripts/apply-max-api-coverage.mjs \
            scripts/finalize-pr24-v2.mjs \
            scripts/finalize-pr24.mjs \
            scripts/fix-max-api-lint.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format final tree
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            credentials/MaxApi.credentials.ts \
            nodes/Max/GenericFunctions.ts \
            nodes/Max/MaxApiOperations.node.ts \
            nodes/Max/MaxApiOperationsDescription.ts \
            nodes/Max/MaxApiRequest.ts \
            nodes/Max/MaxEventProcessor.ts \
            nodes/Max/MaxTriggerConfig.ts \
            nodes/Max/MaxUrlUtils.ts \
            nodes/Max/tests/MaxApiCoverage.test.ts \
            nodes/Max/tests/MaxApiOperations.node.test.ts \
            nodes/Max/tests/MaxApiRequest.test.ts \
            nodes/Max/tests/MaxApiRequestResilience.test.ts \
            nodes/Max/tests/MaxApiReviewFixes.node.test.ts \
            nodes/Max/tests/MaxEventProcessorCurrentEvents.test.ts \
            nodes/Max/tests/MaxTriggerConfig.test.ts \
            README.md AGENTS.md CHANGELOG.md package.json

      - name: Assert every accepted review correction
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'normalizeMaxWebhookUrl' nodes/Max/MaxApiOperations.node.ts
          grep -q 'MAX_API_ATTACHMENT_RETRY_DELAYS_MS' nodes/Max/MaxApiRequest.ts
          grep -q "recipientId === '0'" nodes/Max/MaxApiOperations.node.ts
          grep -q 'instanceof NodeApiError' nodes/Max/MaxApiOperations.node.ts
          grep -q 'platform-api2.max.ru' credentials/MaxApi.credentials.ts
          grep -q 'processCurrentApiEvent' nodes/Max/MaxEventProcessor.ts
          grep -q 'max-api-operations' README.md
          grep -q 'max-api-review-contract' AGENTS.md
          grep -q 'max-api-coverage-release' CHANGELOG.md
          grep -q -- '- master' .github/workflows/ci.yml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" = '1'
          test -f .github/workflows/ci.yml

      - name: Run unit and contract tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verify npm package and diff
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const pack = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(pack.files.map(({ path }) => path));
          for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
            if (!files.has(entry)) throw new Error(`Missing npm entry point: ${entry}`);
          }
          NODE
          git diff --check

      - name: Create exactly one commit over master and force-push it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pavel Frankov'
          git config user.email 'pavel@frankov.ru'
          git fetch --force origin master
          git reset --soft origin/master
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'The final PR diff is empty.' >&2
            exit 1
          fi
          git commit -m 'feat: расширить покрытие актуального MAX Bot API'
          test "$(git rev-list --count origin/master..HEAD)" = '1'
          git push --force origin HEAD:feature/max-api-coverage-23

      - name: Verify the remote branch remains one clean commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          git fetch --force origin master feature/max-api-coverage-23
          test "$(git rev-list --count origin/master..origin/feature/max-api-coverage-23)" = '1'
          sha="$(git rev-parse origin/feature/max-api-coverage-23)"
          extra_workflows="$(git diff --name-only origin/master...origin/feature/max-api-coverage-23 -- '.github/workflows/*' | grep -v '^.github/workflows/ci.yml$' || true)"
          test -z "$extra_workflows"
          gh pr comment 24 --body "Финальный squash подтверждён GitHub Actions: ветка содержит ровно один коммит \`$sha\` поверх \`master\`; unit/contract tests, build, lint и проверка npm-пакета прошли; временные self-mutating workflow удалены и отключены."
