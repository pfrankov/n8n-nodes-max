name: Repair and clean MAX API pull request

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/export-pr-source.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('nodes/Max/tests/MaxApiOperations.node.test.ts')
          test = test_path.read_text()
          old_import = "import type { IExecuteFunctions, INodeExecutionData } from 'n8n-workflow';"
          new_import = "import type { IExecuteFunctions, INodeExecutionData, INodePropertyOptions } from 'n8n-workflow';"
          if old_import in test:
              test = test.replace(old_import, new_import, 1)
          elif new_import not in test:
              raise SystemExit('Expected test type import was not found')
          old_map = ".flatMap((property) => property.options ?? [])\n\t\t\t\t.map((option) => option.value);"
          new_map = ".flatMap((property) => property.options ?? [])\n\t\t\t\t.filter((option): option is INodePropertyOptions => 'value' in option)\n\t\t\t\t.map((option) => option.value);"
          if old_map in test:
              test = test.replace(old_map, new_map, 1)
          elif new_map not in test:
              raise SystemExit('Expected operation option expression was not found')
          test_path.write_text(test)

          operations_path = Path('nodes/Max/MaxApiOperations.node.ts')
          operations = operations_path.read_text()
          old_import = "import { NodeConnectionType, NodeOperationError } from 'n8n-workflow';"
          new_import = "import { ApplicationError, NodeConnectionType, NodeOperationError } from 'n8n-workflow';"
          if old_import in operations:
              operations = operations.replace(old_import, new_import, 1)
          elif new_import not in operations:
              raise SystemExit('Expected operations import was not found')
          operations = operations.replace('throw new Error(', 'throw new ApplicationError(')
          operations_path.write_text(operations)

          request_path = Path('nodes/Max/MaxApiRequest.ts')
          request = request_path.read_text()
          old_import = "import { NodeApiError, NodeOperationError } from 'n8n-workflow';"
          new_import = "import { ApplicationError, NodeApiError, NodeOperationError } from 'n8n-workflow';"
          if old_import in request:
              request = request.replace(old_import, new_import, 1)
          elif new_import not in request:
              raise SystemExit('Expected request import was not found')
          request = request.replace('throw new Error(', 'throw new ApplicationError(')
          request_path.write_text(request)

          description_path = Path('nodes/Max/MaxApiOperationsDescription.ts')
          description = description_path.read_text()
          old_show = "show: { type: ['callback', 'clipboard'] },"
          new_show = "show: { type: ['callback', 'clipboard', 'open_app'] },"
          if old_show in description:
              description = description.replace(old_show, new_show, 1)
          elif new_show not in description:
              raise SystemExit('Expected keyboard payload visibility was not found')
          description = description.replace(
              "The callback data or text copied to the clipboard.",
              "The callback data, clipboard text, or optional mini-app payload.",
              1,
          )
          duplicate_payload = """\t{\n\t\tdisplayName: 'Start Payload',\n\t\tname: 'payload',\n\t\ttype: 'string',\n\t\tdefault: '',\n\t\tdisplayOptions: { show: { type: ['open_app'] } },\n\t\tdescription: 'The optional payload passed to the mini-app.',\n\t},\n"""
          if duplicate_payload in description:
              description = description.replace(duplicate_payload, '', 1)
          description_path.write_text(description)
          PY

      - name: Remove one-time repair machinery
        run: |
          rm -f .github/workflows/apply-max-api-coverage.yml
          rm -f .github/workflows/export-pr-source.yml
          rm -f .github/workflows/final-ready.yml
          rm -f .github/workflows/finalize-max-api-pr.yml
          rm -f .github/workflows/finalize-pr24-v2.yml
          rm -f .github/workflows/finalize-pr24.yml
          rm -f .github/workflows/finalize-with-status.yml
          rm -f .github/workflows/publish-readiness.yml
          rm -f .github/workflows/release-final.yml
          rm -f .github/workflows/release-readiness.yml
          rm -f scripts/apply-max-api-coverage.mjs
          rm -f scripts/finalize-pr24-v2.mjs
          rm -f scripts/finalize-pr24.mjs
          rm -f scripts/fix-max-api-lint.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: >-
          npx prettier --write
          .github/workflows/ci.yml
          nodes/Max/MaxApiOperations.node.ts
          nodes/Max/MaxApiOperationsDescription.ts
          nodes/Max/MaxApiRequest.ts
          nodes/Max/MaxTriggerConfig.ts
          nodes/Max/tests/MaxApiCoverage.test.ts
          nodes/Max/tests/MaxApiOperations.node.test.ts
          nodes/Max/tests/MaxApiRequest.test.ts
          nodes/Max/tests/MaxTriggerConfig.test.ts
          package.json

      - name: Commit cleaned source before verification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m "Очистить PR и исправить ошибки реализации MAX API"
          git push origin HEAD:feature/max-api-coverage-23

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const result = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(result.files.map(({ path }) => path));
          for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
            if (!files.has(entry)) throw new Error(`Missing npm entry point: ${entry}`);
          }
          NODE
          git diff --check
