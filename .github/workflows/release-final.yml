name: Final MAX API release gate

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/release-final.yml

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  node-20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23

      - name: Set up Node.js 20.15.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.1
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify minimum supported runtime
        run: |
          npm test -- --runInBand
          npm run build
          npm run lint

  finalize:
    needs: node-20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove all one-time workflows
        run: |
          rm -f .github/workflows/apply-max-api-coverage.yml
          rm -f .github/workflows/export-pr-source.yml
          rm -f .github/workflows/finalize-max-api-pr.yml
          rm -f .github/workflows/publish-readiness.yml
          rm -f .github/workflows/final-ready.yml
          rm -f .github/workflows/finalize-with-status.yml
          rm -f .github/workflows/release-readiness.yml
          rm -f .github/workflows/release-final.yml
          rm -f scripts/apply-max-api-coverage.mjs
          rm -f scripts/fix-max-api-lint.mjs

      - name: Normalize release metadata
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" = "0.1.26" ]; then
            npm version 0.1.27 --no-git-tag-version
          elif [ "$CURRENT_VERSION" != "0.1.27" ]; then
            echo "Unexpected package version: $CURRENT_VERSION" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          text = text.replace('## Не выпущено', '## 0.1.27 — 2026-09-03', 1)
          path.write_text(text)
          PY

      - name: Install
        run: npm ci

      - name: Format
        run: >-
          npx prettier --write
          "nodes/Max/**/*.{ts,json}"
          "credentials/**/*.ts"
          .github/workflows/ci.yml
          package.json
          package-lock.json
          README.md
          CHANGELOG.md

      - name: Apply lint fixes
        run: npm run lintfix

      - name: Verify Node.js 22
        run: |
          npm test -- --runInBand
          npm run build
          npm run lint

      - name: Confirm production dependencies were not expanded
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const current = require('./package.json').dependencies ?? {};
          const base = JSON.parse(execFileSync('git', ['show', 'origin/master:package.json'], { encoding: 'utf8' })).dependencies ?? {};
          if (JSON.stringify(current) !== JSON.stringify(base)) {
            throw new Error(`Production dependencies changed: ${JSON.stringify({ base, current })}`);
          }
          NODE
          npm audit --omit=dev --json > /tmp/production-audit.json || true

      - name: Verify publishable npm package
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const pack = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(pack.files.map(({ path }) => path));
          for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
            if (!files.has(entry)) throw new Error(`Missing npm entry point: ${entry}`);
          }
          if (manifest.version !== '0.1.27') throw new Error(`Expected 0.1.27, got ${manifest.version}`);
          NODE
          git diff --check

      - name: Commit final release state
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Завершена подготовка выпуска 0.1.27"
          git push origin HEAD:feature/max-api-coverage-23
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark exact head as verified and publish PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api --method POST "/repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context='publication-readiness' \
            -f description='Node 20.15/22, tests, build, lint and npm tarball passed'

          cat > /tmp/body.md <<'EOF'
          ## Что изменено

          PR расширяет покрытие актуального публичного MAX Bot API и сохраняет совместимость существующих workflow с нодой `Max`.

          ### Новая нода `Max API`

          - Bot: информация о боте и управление командами.
          - Message: чтение сообщений, сведения о видео, расширенная отправка/редактирование и Answer Callback.
          - Chat: обновление данных, действия, pin/unpin, закреплённое сообщение, membership бота и выход.
          - Chat Member: получение, добавление и удаление участников.
          - Chat Administrator: получение, назначение/обновление прав и снятие администратора.
          - Comment: полный CRUD комментариев к публикациям каналов.
          - Subscription: получение, создание и удаление Webhook-подписок.

          ### Существующие ноды

          - `Max Trigger` дополнен актуальными событиями остановки бота, изменений диалога и комментариев.
          - Inline Keyboard дополнена кнопками `message` и `clipboard`.
          - `int64`-идентификаторы передаются строками без потери точности.
          - Получение отдельного чата, удаление сообщений и загрузка вложений остаются в обратно совместимой ноде `Max` и не дублируются.

          `GET /chats` и Long Polling намеренно не добавлены: список чатов удалён из актуального API, а для n8n используется Webhook-trigger.

          ## Готовность выпуска

          - версия пакета: `0.1.27`;
          - тесты, build и lint на Node.js `20.15.1` и `22`;
          - production dependency set не расширен; audit-отчёт сформирован отдельно;
          - проверены npm tarball и все объявленные n8n entry points;
          - удалены все временные миграционные workflow и скрипты.

          Closes #23
          EOF

          gh api --method PATCH "/repos/$REPO/pulls/24" \
            -f title='Расширить покрытие актуального MAX Bot API' \
            -F body=@/tmp/body.md

          if [ "$(gh api "/repos/$REPO/pulls/24" --jq .draft)" = "true" ]; then
            PR_NODE_ID=$(gh api "/repos/$REPO/pulls/24" --jq .node_id)
            gh api graphql \
              -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { isDraft url } } }' \
              -f id="$PR_NODE_ID"
          fi
