name: Finalize PR 24 v2

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/finalize-pr24-v2.yml
      - scripts/finalize-pr24-v2.mjs

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr-24-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply independent final pass
        run: |
          node --check scripts/finalize-pr24-v2.mjs
          node scripts/finalize-pr24-v2.mjs

      - name: Format and apply safe lint fixes
        run: |
          npx prettier --write \
            nodes/Max/GenericFunctions.ts \
            nodes/Max/MaxApiOperations.node.ts \
            nodes/Max/MaxApiOperationsDescription.ts \
            nodes/Max/MaxApiRequest.ts \
            nodes/Max/MaxTriggerConfig.ts \
            nodes/Max/MaxUpload.ts \
            nodes/Max/MaxWebhookManager.ts \
            nodes/Max/tests/MaxApiAdditionalCoverage.test.ts \
            nodes/Max/tests/MaxApiOperations.node.test.ts \
            credentials/MaxApi.credentials.ts \
            credentials/tests/MaxApi.credentials.test.ts \
            package.json \
            README.md \
            CHANGELOG.md
          npm run lintfix

      - name: Run all tests
        run: npm test -- --runInBand

      - name: Build distributable package
        run: npm run build

      - name: Run final lint
        run: npm run lint

      - name: Validate npm package and diff
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(report.files.map((entry) => entry.path));
          for (const node of manifest.n8n.nodes) {
            if (!files.has(node)) throw new Error(`Registered node ${node} is absent from npm pack`);
          }
          if (!files.has('dist/nodes/Max/MaxApiOperations.node.js')) {
            throw new Error('Max API node is absent from npm pack');
          }
          if ([...files].some((file) => /Polling|LongPoll/i.test(file))) {
            throw new Error('An experimental polling implementation leaked into npm pack');
          }
          NODE
          git diff --check

      - name: Remove every one-shot helper
        run: |
          rm -f \
            .github/workflows/finalize-pr24.yml \
            .github/workflows/finalize-pr24-v2.yml \
            .github/workflows/apply-max-api-coverage.yml \
            .github/workflows/export-pr-source.yml \
            scripts/finalize-pr24.mjs \
            scripts/finalize-pr24-v2.mjs \
            scripts/apply-max-api-coverage.mjs \
            scripts/fix-max-api-lint.mjs

      - name: Commit verified source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes were required"
          else
            HUSKY=0 git commit -m "feat: finalize current MAX Bot API coverage"
            git push origin HEAD:feature/max-api-coverage-23
          fi
          git rev-parse HEAD > /tmp/final-head

      - name: Wait for CI on final head
        run: |
          head_sha="$(cat /tmp/final-head)"
          for attempt in $(seq 1 120); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "CI")]')"
            count="$(jq 'length' <<<"$runs")"
            active="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
            failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then
              jq -r '.[] | "CI \(.html_url): \(.status)/\(.conclusion)"' <<<"$runs"
              exit 1
            fi
            if [ "$count" -gt 0 ] && [ "$active" -eq 0 ]; then
              jq -r '.[] | "CI \(.html_url): success"' <<<"$runs"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for CI for ${head_sha}" >&2
          exit 1

      - name: Update and publish PR
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Что изменено

          PR доводит community node до покрытия текущего публичного MAX Bot API, сохраняя совместимость существующих workflow на нодах `Max` и `Max Trigger`.

          ### Новая нода `Max API`

          - **Bot:** сведения о боте и полная замена списка команд.
          - **Message:** отправка, получение одного сообщения, история по chat/message IDs, изменение, удаление, callback answer и сведения о видео.
          - **Chat:** получение и изменение чата/канала, typing и sending actions, pinned message, pin/unpin, membership и выход бота.
          - **Chat Member:** получение с пагинацией или по IDs, добавление и удаление/блокировка.
          - **Chat Administrator:** получение, назначение/обновление полного набора permissions и снятие прав.
          - **Comment:** получение списка/одного комментария, создание, изменение и удаление.
          - **Subscription:** получение, создание/обновление и удаление webhook-подписки.
          - **Upload:** двухшаговая загрузка binary data для `image`, `video`, `audio` и `file`.

          ### Существующие ноды

          - `Max Trigger` получил актуальные события `bot_stopped`, изменений диалога и комментариев.
          - Inline Keyboard поддерживает актуальные типы кнопок, включая `message` и `clipboard`.
          - `int64` IDs остаются строками, поэтому не теряют точность JavaScript.
          - Старое официальное значение API host мигрирует на актуальный host; пользовательские base URL не меняются.

          ## Намеренно не добавлено

          - `GET /chats`: список чатов больше не является поддерживаемой операцией текущего API.
          - Long Polling: webhook trigger уже является корректным lifecycle-механизмом для постоянно работающего n8n workflow; одновременно использовать оба транспорта нельзя.

          ## Проверка

          - `npm test -- --runInBand`
          - `npm run build`
          - `npm run lint`
          - `npm pack --dry-run --json`
          - проверка каждой зарегистрированной n8n node в npm-пакете
          - `git diff --check`
          - отдельный CI на очищенном финальном коммите

          Closes #23.
          EOF
          sed -i 's/^          //' /tmp/pr-body.md
          gh pr edit 24 --title "Расширить покрытие актуального MAX Bot API" --body-file /tmp/pr-body.md
          pr_json="$(gh pr view 24 --json isDraft,state,mergeable,headRefOid)"
          if [ "$(jq -r .state <<<"$pr_json")" != "OPEN" ]; then
            echo "PR is not open" >&2
            exit 1
          fi
          gh pr ready 24 || true
          gh pr view 24 --json url,isDraft,state,mergeable,headRefOid
