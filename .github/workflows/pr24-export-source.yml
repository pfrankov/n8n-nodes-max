name: Export PR 24 source for final review

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/pr24-export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Create source archives
        run: |
          git archive --format=tar.gz --output=/tmp/n8n-nodes-max-pr24.tar.gz HEAD
          git archive --format=tar.gz --output=/tmp/n8n-nodes-max-master.tar.gz origin/master

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: n8n-nodes-max-pr24-and-master
          path: |
            /tmp/n8n-nodes-max-pr24.tar.gz
            /tmp/n8n-nodes-max-master.tar.gz
          if-no-files-found: error
          retention-days: 1
