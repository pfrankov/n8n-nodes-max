name: Export PR 24 source for final review

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/pr24-export-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23

      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/n8n-nodes-max-pr24.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: n8n-nodes-max-pr24-source
          path: /tmp/n8n-nodes-max-pr24.tar.gz
          if-no-files-found: error
          retention-days: 1

# Refreshed for the final review-comment pass.
