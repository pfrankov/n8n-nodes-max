name: Verify publication readiness

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/publish-readiness.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize final tree
        run: |
          rm -f .github/workflows/apply-max-api-coverage.yml
          rm -f .github/workflows/export-pr-source.yml
          rm -f .github/workflows/finalize-max-api-pr.yml
          rm -f .github/workflows/publish-readiness.yml
          rm -f scripts/apply-max-api-coverage.mjs
          rm -f scripts/fix-max-api-lint.mjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          test_path = Path('nodes/Max/tests/MaxApiOperations.node.test.ts')
          text = test_path.read_text()
          text = text.replace(
              '.map((option) => option.value);',
              ".map((option) => ('value' in option ? option.value : undefined));",
          )
          text = text.replace(
              '.map((option: any) => option.value);',
              ".map((option) => ('value' in option ? option.value : undefined));",
          )
          text = text.replace(
              '.map((option) => (option as { value: unknown }).value);',
              ".map((option) => ('value' in option ? option.value : undefined));",
          )
          test_path.write_text(text)

          path = Path('nodes/Max/MaxApiOperationsDescription.ts')
          description = path.read_text()
          description = description.replace(
              "show: { type: ['callback', 'clipboard'] },",
              "show: { type: ['callback', 'clipboard', 'open_app'] },",
          )
          description = description.replace(
              'The callback data or text copied to the clipboard.',
              'The callback data, clipboard text, or optional mini-app payload.',
          )
          description = re.sub(
              r"\n\s*\{\s*\n\s*displayName: 'Start Payload',\s*\n\s*name: 'payload',\s*\n\s*type: 'string',\s*\n\s*default: '',\s*\n\s*displayOptions: \{ show: \{ type: \['open_app'\] \} \},\s*\n\s*description: 'The optional payload passed to the mini-app\.',\s*\n\s*\},",
              '',
              description,
          )
          path.write_text(description)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: >-
          npx prettier --write
          "nodes/Max/**/*.{ts,json}"
          "credentials/**/*.ts"
          .github/workflows/ci.yml
          package.json
          README.md
          CHANGELOG.md

      - name: Fix lintable issues
        run: npm run lintfix

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Validate package manifest and tarball
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = require('./package.json');
          const pack = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(pack.files.map((file) => file.path));
          const required = [
            ...packageJson.n8n.nodes,
            ...packageJson.n8n.credentials,
          ];
          for (const file of required) {
            if (!files.has(file)) {
              throw new Error(`Declared n8n entry is missing from npm package: ${file}`);
            }
          }
          NODE

      - name: Validate API coverage and clean diff
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const operations = fs.readFileSync('nodes/Max/MaxApiOperations.node.ts', 'utf8');
          const description = fs.readFileSync('nodes/Max/MaxApiOperationsDescription.ts', 'utf8');
          const trigger = fs.readFileSync('nodes/Max/MaxTriggerConfig.ts', 'utf8');
          const allNodeSource = fs.readdirSync('nodes/Max')
            .filter((name) => name.endsWith('.ts'))
            .map((name) => fs.readFileSync(`nodes/Max/${name}`, 'utf8'))
            .join('\n');

          const requiredOperationMarkers = [
            '/me',
            '/me/commands',
            '/messages',
            '/video/',
            '/chats/',
            '/actions',
            '/pin',
            '/members/me',
            '/members',
            '/admins',
            '/comments',
            '/subscriptions',
          ];
          for (const marker of requiredOperationMarkers) {
            if (!operations.includes(marker)) {
              throw new Error(`MAX API operation marker is missing: ${marker}`);
            }
          }

          for (const button of ["value: 'message'", "value: 'clipboard'"]) {
            if (!description.includes(button)) {
              throw new Error(`Inline keyboard button is missing: ${button}`);
            }
          }

          for (const event of [
            'bot_stopped',
            'dialog_cleared',
            'dialog_muted',
            'dialog_unmuted',
            'dialog_removed',
            'comment_created',
            'comment_edited',
            'comment_removed',
          ]) {
            if (!trigger.includes(event)) {
              throw new Error(`Trigger event is missing: ${event}`);
            }
          }

          for (const legacyMarker of ['/uploads', "operation === 'deleteMessage'", "operation === 'getChat'"]) {
            if (!allNodeSource.includes(legacyMarker)) {
              throw new Error(`Existing Max operation unexpectedly disappeared: ${legacyMarker}`);
            }
          }
          NODE

          git diff --check
          test ! -e .github/workflows/apply-max-api-coverage.yml
          test ! -e .github/workflows/export-pr-source.yml
          test ! -e .github/workflows/finalize-max-api-pr.yml
          test ! -e scripts/apply-max-api-coverage.mjs
          test ! -e scripts/fix-max-api-lint.mjs

      - name: Commit final cleanup
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Подготовлен чистый PR к публикации"
            git push origin HEAD:feature/max-api-coverage-23
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for required CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ['REPO']
          sha = os.environ['HEAD_SHA']
          deadline = time.time() + 900

          while time.time() < deadline:
              payload = subprocess.check_output(
                  ['gh', 'api', f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=30'],
                  text=True,
              )
              runs = [
                  run for run in json.loads(payload).get('workflow_runs', [])
                  if run.get('name') == 'CI' and run.get('head_sha') == sha
              ]
              if not runs or any(run.get('status') != 'completed' for run in runs):
                  time.sleep(10)
                  continue
              failures = [run for run in runs if run.get('conclusion') != 'success']
              if failures:
                  raise SystemExit(f'Required CI failed: {failures}')
              print(f'Required CI passed for {sha}')
              break
          else:
              raise SystemExit(f'Timed out waiting for required CI on {sha}')
          PY

      - name: Publish final PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Что изменено

          PR расширяет покрытие актуального публичного MAX Bot API и сохраняет совместимость существующих workflow с нодой `Max`.

          ### `Max API`

          - Bot: информация о боте и управление командами.
          - Message: чтение сообщений, сведения о видео, расширенная отправка/редактирование и Answer Callback.
          - Chat: обновление данных, действия, pin/unpin, закреплённое сообщение, membership бота и выход.
          - Chat Member: получение, добавление и удаление участников.
          - Chat Administrator: получение, назначение/обновление прав и снятие администратора.
          - Comment: полный CRUD комментариев к публикациям каналов.
          - Subscription: получение, создание и удаление Webhook-подписок.

          ### Существующие ноды

          - `Max Trigger` дополнен актуальными событиями остановки бота, изменений диалога и комментариев.
          - Inline Keyboard дополнена кнопками `message` и `clipboard`.
          - `int64`-идентификаторы передаются строками без потери точности.
          - Операции получения отдельного чата, удаления сообщений и загрузки вложений остаются в обратно совместимой ноде `Max` и не дублируются.

          `GET /chats` и Long Polling намеренно не добавлены: список чатов удалён из актуального API, а для n8n используется Webhook-trigger.

          ## Проверено

          - unit- и контрактные тесты;
          - TypeScript build;
          - ESLint;
          - `npm pack --dry-run` и наличие всех объявленных n8n entry points в пакете;
          - отсутствие временных миграционных workflow и скриптов;
          - повторная матрица операций из issue #23.

          Closes #23
          EOF

          gh api --method PATCH "/repos/$REPO/pulls/24" \
            -f title='Расширить покрытие актуального MAX Bot API' \
            -F body=@/tmp/pr-body.md

          IS_DRAFT=$(gh api "/repos/$REPO/pulls/24" --jq .draft)
          if [ "$IS_DRAFT" = "true" ]; then
            PR_NODE_ID=$(gh api "/repos/$REPO/pulls/24" --jq .node_id)
            gh api graphql \
              -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { isDraft url } } }' \
              -f id="$PR_NODE_ID"
          fi
