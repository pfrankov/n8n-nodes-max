name: Apply MAX API coverage migration

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/apply-max-api-coverage.yml
      - scripts/apply-max-api-coverage.mjs
      - scripts/fix-max-api-lint.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply migration
        run: |
          node scripts/apply-max-api-coverage.mjs
          node scripts/fix-max-api-lint.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: >-
          npx prettier --write
          nodes/Max/GenericFunctions.ts
          nodes/Max/MaxWebhookManager.ts
          nodes/Max/MaxApiRequest.ts
          nodes/Max/MaxApiOperations.node.ts
          nodes/Max/MaxApiOperationsDescription.ts
          nodes/Max/MaxTriggerConfig.ts
          nodes/Max/tests/MaxApiOperations.node.test.ts
          nodes/Max/tests/MaxApiCoverage.test.ts
          nodes/Max/tests/MaxApiRequest.test.ts
          nodes/Max/tests/MaxTriggerConfig.test.ts
          nodes/Max/tests/MaxWebhookManager.test.ts
          nodes/Max/tests/GenericFunctions.test.ts
          nodes/Max/tests/testUtils.ts
          nodes/Max/tests/fixtures/testData.ts
          credentials/MaxApi.credentials.ts
          credentials/tests/MaxApi.credentials.test.ts
          package.json
          README.md
          AGENTS.md
          CHANGELOG.md

      - name: Apply n8n lint fixes
        run: npm run lintfix || true

      - name: Capture test result
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand 2>&1 | tee test-output.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture build result
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture lint result
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit migration and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Обновлены существующие ноды под актуальный MAX API" || true
          git push origin HEAD:feature/max-api-coverage-23

      - name: Fail if verification failed
        shell: bash
        run: |
          test "${{ steps.tests.outputs.status }}" = "0"
          test "${{ steps.build.outputs.status }}" = "0"
          test "${{ steps.lint.outputs.status }}" = "0"
