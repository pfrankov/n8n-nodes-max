name: Finalize MAX API PR

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/finalize-max-api.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalize source tree
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding='utf-8')

          description = Path('nodes/Max/MaxApiOperationsDescription.ts')
          lines = description.read_text(encoding='utf-8').splitlines()
          description.write_text(
              '\n'.join(line for line in lines if line.strip() != ',') + '\n',
              encoding='utf-8',
          )

          generic = 'nodes/Max/GenericFunctions.ts'
          text = read(generic)
          if "from './MaxApiRequest'" not in text:
              text = text.replace(
                  "import { basename, join } from 'path';\n",
                  "import { basename, join } from 'path';\nimport { normalizeMaxBaseUrl } from './MaxApiRequest';\n",
              )
          text = text.replace(
              "const DEFAULT_MAX_BASE_URL = 'https://platform-api.max.ru';",
              "const DEFAULT_MAX_BASE_URL = 'https://platform-api2.max.ru';",
          )
          text = text.replace(
              "const baseUrl = (credentials['baseUrl'] as string) || DEFAULT_MAX_BASE_URL;",
              "const baseUrl = normalizeMaxBaseUrl(credentials['baseUrl'] || DEFAULT_MAX_BASE_URL);",
          )
          write(generic, text)

          webhook = 'nodes/Max/MaxWebhookManager.ts'
          text = read(webhook)
          if "from './MaxApiRequest'" not in text:
              anchor = "import type { MaxSubscriptionsResponse, MaxTriggerEvent } from './MaxTriggerConfig';\n"
              text = text.replace(anchor, anchor + "import { normalizeMaxBaseUrl } from './MaxApiRequest';\n")
          text = text.replace(
              "private readonly DEFAULT_BASE_URL = 'https://platform-api.max.ru';",
              "private readonly DEFAULT_BASE_URL = 'https://platform-api2.max.ru';",
          )
          text = text.replace(
              "const baseUrl = (credentials['baseUrl'] as string) || this.DEFAULT_BASE_URL;",
              "const baseUrl = normalizeMaxBaseUrl(credentials['baseUrl'] || this.DEFAULT_BASE_URL);",
          )
          write(webhook, text)

          credentials = 'credentials/MaxApi.credentials.ts'
          text = read(credentials)
          text = text.replace(
              "default: 'https://platform-api.max.ru',",
              "default: 'https://platform-api2.max.ru',",
          )
          text = text.replace(
              "baseURL: '={{$credentials.baseUrl}}',",
              "baseURL:\n\t\t\t\t'={{$credentials.baseUrl === \\\"https://platform-api.max.ru\\\" ? \\\"https://platform-api2.max.ru\\\" : $credentials.baseUrl}}',",
          )
          write(credentials, text)

          credential_test = 'credentials/tests/MaxApi.credentials.test.ts'
          text = read(credential_test)
          text = text.replace(
              "expect(maxApiCredentials.test.request.baseURL).toBe('={{$credentials.baseUrl}}');",
              "expect(maxApiCredentials.test.request.baseURL).toBe(\n\t\t\t\t'={{$credentials.baseUrl === \\\"https://platform-api.max.ru\\\" ? \\\"https://platform-api2.max.ru\\\" : $credentials.baseUrl}}',\n\t\t\t);",
          )
          write(credential_test, text)

          for directory in (Path('credentials/tests'), Path('nodes/Max/tests')):
              for test_file in directory.rglob('*.ts'):
                  if test_file.as_posix().endswith('MaxApiRequest.test.ts') or test_file.as_posix().endswith('MaxApi.credentials.test.ts'):
                      continue
                  text = test_file.read_text(encoding='utf-8')
                  test_file.write_text(
                      text.replace('https://platform-api.max.ru', 'https://platform-api2.max.ru'),
                      encoding='utf-8',
                  )

          operations_test = 'nodes/Max/tests/MaxApiOperations.node.test.ts'
          text = read(operations_test).replace(
              '.map((option) => option.value);',
              '.map((option: any) => option.value);',
          )
          write(operations_test, text)

          operations_description = 'nodes/Max/MaxApiOperationsDescription.ts'
          text = read(operations_description)
          text = text.replace(
              "show: { type: ['callback', 'clipboard'] },",
              "show: { type: ['callback', 'clipboard', 'open_app'] },",
          )
          text = text.replace(
              "description: 'The callback data or text copied to the clipboard.',",
              "description: 'The callback data, clipboard text, or optional mini-app payload.',",
          )
          text = text.replace(
              "\t{\n\t\tdisplayName: 'Start Payload',\n\t\tname: 'payload',\n\t\ttype: 'string',\n\t\tdefault: '',\n\t\tdisplayOptions: { show: { type: ['open_app'] } },\n\t\tdescription: 'The optional payload passed to the mini-app.',\n\t},\n",
              '',
          )
          write(operations_description, text)

          for path in ('README.md', 'AGENTS.md'):
              file = Path(path)
              if file.exists():
                  file.write_text(
                      file.read_text(encoding='utf-8').replace(
                          'https://platform-api.max.ru',
                          'https://platform-api2.max.ru',
                      ),
                      encoding='utf-8',
                  )

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              if '## Advanced MAX API operations' not in text:
                  text = text.rstrip() + '''

          ## Advanced MAX API operations

          Use **Max API** for current operations that do not fit the compact legacy node:

          - bot information and command management;
          - message history, individual messages, video metadata, advanced callback answers, and current inline keyboard buttons;
          - chat updates, actions, pinned messages, bot membership, members, and administrators;
          - channel comments and explicit webhook subscription management.

          Existing workflows using **Max** and **Max Trigger** remain compatible. **Max Trigger** also exposes the current bot, dialog, and comment update types. The removed `GET /chats` method and Long Polling are intentionally not exposed: MAX marks chat listing as unsupported and recommends Webhook instead of Long Polling for production.
          '''
                  readme.write_text(text + '\n', encoding='utf-8')

          agents = Path('AGENTS.md')
          if agents.exists():
              text = agents.read_text(encoding='utf-8')
              if '`Max API` node' not in text:
                  text = text.replace(
                      '| `Max` node           | Outbound actions for messages/chats                        |',
                      '| `Max` node           | Backward-compatible core message/chat actions              |\n| `Max API` node       | Current Bot API resources and advanced operations           |',
                  )
                  agents.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          if changelog.exists():
              text = changelog.read_text(encoding='utf-8')
              if 'Расширено покрытие актуального MAX Bot API' not in text:
                  entry = '''## Не выпущено

          ### Добавлено

          - Расширено покрытие актуального MAX Bot API: команды бота, чтение сообщений, сведения о видео, управление чатами, участниками и администраторами, комментарии и подписки Webhook.
          - В inline-клавиатуру добавлены кнопки типов `message` и `clipboard`.
          - В Max Trigger добавлены события остановки бота, изменений диалога и комментариев.

          ### Улучшено

          - Запросы по умолчанию направляются на актуальный домен `platform-api2.max.ru`; сохранённые настройки со старым официальным доменом переводятся автоматически.
          - Идентификаторы `int64` передаются строками без риска потери точности JavaScript.

          '''
                  changelog.write_text(entry + text, encoding='utf-8')

          for path in (
              '.github/workflows/apply-max-api-coverage.yml',
              'scripts/apply-max-api-coverage.mjs',
              'scripts/fix-max-api-lint.mjs',
              '.github/workflows/finalize-max-api.yml',
          ):
              file = Path(path)
              if file.exists():
                  file.unlink()
          scripts = Path('scripts')
          if scripts.exists() and not any(scripts.iterdir()):
              scripts.rmdir()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npx prettier --write nodes credentials package.json README.md AGENTS.md CHANGELOG.md .github/workflows/ci.yml

      - name: Apply safe lint fixes
        run: npm run lintfix

      - name: Verify
        shell: bash
        run: |
          npx prettier --check nodes credentials package.json README.md AGENTS.md CHANGELOG.md .github/workflows/ci.yml
          npm test -- --runInBand
          npm run build
          npm run lint
          npm pack --dry-run --json > /tmp/npm-pack.json
          git diff --check

      - name: Commit final source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          HUSKY=0 git commit -m "Доведено покрытие MAX API до готового состояния"
          git push origin HEAD:feature/max-api-coverage-23
