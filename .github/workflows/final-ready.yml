name: Final ready-for-review gate

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/final-ready.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove one-time tooling and normalize known findings
        run: |
          rm -f .github/workflows/apply-max-api-coverage.yml
          rm -f .github/workflows/export-pr-source.yml
          rm -f .github/workflows/finalize-max-api-pr.yml
          rm -f .github/workflows/publish-readiness.yml
          rm -f .github/workflows/final-ready.yml
          rm -f scripts/apply-max-api-coverage.mjs
          rm -f scripts/fix-max-api-lint.mjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          test_path = Path('nodes/Max/tests/MaxApiOperations.node.test.ts')
          text = test_path.read_text()
          for old in (
              '.map((option) => option.value);',
              '.map((option: any) => option.value);',
              '.map((option) => (option as { value: unknown }).value);',
          ):
              text = text.replace(
                  old,
                  ".map((option) => ('value' in option ? option.value : undefined));",
              )
          test_path.write_text(text)

          description_path = Path('nodes/Max/MaxApiOperationsDescription.ts')
          description = description_path.read_text()
          description = description.replace(
              "show: { type: ['callback', 'clipboard'] },",
              "show: { type: ['callback', 'clipboard', 'open_app'] },",
          )
          description = description.replace(
              'The callback data or text copied to the clipboard.',
              'The callback data, clipboard text, or optional mini-app payload.',
          )
          description = re.sub(
              r"\n\s*\{\s*\n\s*displayName: 'Start Payload',\s*\n\s*name: 'payload',\s*\n\s*type: 'string',\s*\n\s*default: '',\s*\n\s*displayOptions: \{ show: \{ type: \['open_app'\] \} \},\s*\n\s*description: 'The optional payload passed to the mini-app\.',\s*\n\s*\},",
              '',
              description,
          )
          description_path.write_text(description)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          if 'Verify npm package' not in ci:
              needle = '      - name: Lint\n        run: npm run lint\n'
              if needle not in ci:
                  raise SystemExit('CI lint step was not found')
              ci = ci.replace(
                  needle,
                  needle + '\n      - name: Verify npm package\n        run: npm pack --dry-run --json > /tmp/npm-pack.json\n',
              )
          ci_path.write_text(ci)
          PY

      - name: Install
        run: npm ci

      - name: Format
        run: >-
          npx prettier --write
          "nodes/Max/**/*.{ts,json}"
          "credentials/**/*.ts"
          .github/workflows/ci.yml
          package.json
          README.md
          CHANGELOG.md

      - name: Lint fix
        run: npm run lintfix

      - name: Tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Package verification
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const result = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const packed = new Set(result.files.map(({ path }) => path));
          for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
            if (!packed.has(entry)) throw new Error(`Missing npm entry: ${entry}`);
          }
          NODE
          git diff --check

      - name: Commit final tree
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Завершена подготовка MAX API к публикации"
            git push origin HEAD:feature/max-api-coverage-23
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for final CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ['REPO']
          sha = os.environ['HEAD_SHA']
          deadline = time.time() + 900
          while time.time() < deadline:
              data = json.loads(subprocess.check_output(
                  ['gh', 'api', f'/repos/{repo}/actions/runs?head_sha={sha}&per_page=30'],
                  text=True,
              ))
              runs = [r for r in data.get('workflow_runs', []) if r.get('name') == 'CI' and r.get('head_sha') == sha]
              if not runs or any(r.get('status') != 'completed' for r in runs):
                  time.sleep(10)
                  continue
              bad = [r for r in runs if r.get('conclusion') != 'success']
              if bad:
                  raise SystemExit(f'Final CI failed: {bad}')
              print(f'Final CI passed for {sha}')
              break
          else:
              raise SystemExit(f'Final CI timeout for {sha}')
          PY

      - name: Set final PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/body.md <<'EOF'
          ## Что изменено

          PR расширяет покрытие актуального публичного MAX Bot API и сохраняет совместимость существующих workflow с нодой `Max`.

          ### Новая нода `Max API`

          - Bot: информация о боте и управление командами.
          - Message: чтение сообщений, сведения о видео, расширенная отправка/редактирование и Answer Callback.
          - Chat: обновление данных, действия, pin/unpin, закреплённое сообщение, membership бота и выход.
          - Chat Member: получение, добавление и удаление участников.
          - Chat Administrator: получение, назначение/обновление прав и снятие администратора.
          - Comment: полный CRUD комментариев к публикациям каналов.
          - Subscription: получение, создание и удаление Webhook-подписок.

          ### Существующие ноды

          - `Max Trigger` дополнен актуальными событиями остановки бота, изменений диалога и комментариев.
          - Inline Keyboard дополнена кнопками `message` и `clipboard`.
          - `int64`-идентификаторы передаются строками без потери точности.
          - Получение отдельного чата, удаление сообщений и загрузка вложений остаются в обратно совместимой ноде `Max` и не дублируются.

          `GET /chats` и Long Polling намеренно не добавлены: список чатов удалён из актуального API, а для n8n используется Webhook-trigger.

          ## Проверено

          - unit- и контрактные тесты;
          - TypeScript build;
          - ESLint;
          - содержимое npm tarball и все объявленные n8n entry points;
          - чистота diff без временных миграционных workflow и скриптов.

          Closes #23
          EOF

          gh api --method PATCH "/repos/$REPO/pulls/24" \
            -f title='Расширить покрытие актуального MAX Bot API' \
            -F body=@/tmp/body.md

          if [ "$(gh api "/repos/$REPO/pulls/24" --jq .draft)" = "true" ]; then
            PR_NODE_ID=$(gh api "/repos/$REPO/pulls/24" --jq .node_id)
            gh api graphql \
              -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { isDraft url } } }' \
              -f id="$PR_NODE_ID"
          fi
