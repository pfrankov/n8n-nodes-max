          \t\tconst httpRequest = jest.fn().mockRejectedValueOnce({ message: 'Some Markdown syntax is not supported' }).mockResolvedValueOnce({ success: true });
          \t\tawait expect(maxApiRequest(requestContext(httpRequest), { method: 'POST', path: '/messages', body: { text: '**bold**', format: 'markdown' } })).resolves.toEqual({ success: true });
