          - Новые события `bot_stopped`, `dialog_*` и `comment_*` в **Max Trigger**.
          - Кнопки `message`, `clipboard` и актуальные параметры `open_app` для inline keyboard.
          - Контрактные и регрессионные тесты для новых методов MAX Bot API.

          ### Изменено

          - Официальный API endpoint переведён на `https://platform-api2.max.ru` с прозрачной миграцией сохранённого старого значения.
          - Идентификаторы `int64` передаются строками без потери точности, а query-параметры сохраняют значения `false` и `0`.
          - Отправка сообщений повторяется при временной обработке медиа; неподдерживаемый Markdown один раз преобразуется в plain text.
          - Ошибки MAX сохраняются как `NodeApiError` со структурированными данными ответа.
          '''
