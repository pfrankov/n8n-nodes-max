          \t\t\treturnJsonArray: jest.fn((value: IDataObject | IDataObject[]) => (Array.isArray(value) ? value : [value]).map((json) => ({ json }))),
          \t\t\tconstructExecutionMetaData: jest.fn((items: INodeExecutionData[]) => items),
          \t\t},
