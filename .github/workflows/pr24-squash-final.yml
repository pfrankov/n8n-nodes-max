          \tit('retries media while MAX processes an attachment', async () => {
          \t\tjest.useFakeTimers();
          \t\tconst httpRequest = jest.fn().mockRejectedValueOnce({ response: { body: { code: 'attachment.not.ready', message: 'errors.process.attachment.file.not.processed' } } }).mockResolvedValueOnce({ success: true });
          \t\tconst pending = maxApiRequest(requestContext(httpRequest), { method: 'POST', path: '/messages', body: { text: 'file', attachments: [{ type: 'file', payload: { token: 'token' } }] } });
          \t\tawait jest.runAllTimersAsync();
          \t\tawait expect(pending).resolves.toEqual({ success: true });
          \t\texpect(httpRequest).toHaveBeenCalledTimes(2);
          \t\tjest.useRealTimers();
          \t});

          \tit('rejects recipient ID zero locally', async () => {
          \t\tconst httpRequest = jest.fn();
          \t\tconst context = operationContext({ resource: 'message', operation: 'send', sendTo: 'user', recipientId: '0', text: 'hello', format: 'plain', attachmentsJson: '', keyboard: {}, clearAttachments: false, notify: true, replyToMessageId: '', forwardMessageId: '', disableLinkPreview: false }, httpRequest);
          \t\tawait expect(new MaxApiOperations().execute.call(context)).rejects.toBeInstanceOf(NodeOperationError);
          \t\texpect(httpRequest).not.toHaveBeenCalled();
          \t});

          \tit('preserves NodeApiError for upstream failures', async () => {
          \t\tconst httpRequest = jest.fn().mockRejectedValue({ response: { statusCode: 503, body: { code: 'unavailable', message: 'Try later' } } });
          \t\tawait expect(new MaxApiOperations().execute.call(operationContext({ resource: 'bot', operation: 'get' }, httpRequest))).rejects.toBeInstanceOf(NodeApiError);
          \t});

          \tit('normalizes subscription URLs before registration', async () => {
          \t\tconst httpRequest = jest.fn().mockResolvedValue({ success: true });
          \t\tawait new MaxApiOperations().execute.call(operationContext({ resource: 'subscription', operation: 'create', url: 'https://пример.рф/webhook', updateTypes: ['message_created'], secret: '', version: '' }, httpRequest));
