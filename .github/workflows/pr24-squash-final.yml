          # User-facing documentation and release notes.
          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          readme_section = '''
          ## Max API: расширенные операции

          Нода **Max API** дополняет обратно совместимую ноду **Max** и предоставляет актуальные методы Bot API в интерфейсе n8n:

          - **Bot** — получение данных бота и полная замена списка команд.
          - **Message** — отправка, чтение, редактирование и удаление сообщений, получение данных видео и ответ на callback.
          - **Chat** — получение и изменение чата или канала, действия бота, pin/unpin, членство бота и выход.
          - **Chat Member** — получение, добавление и удаление участников.
          - **Chat Administrator** — получение администраторов, назначение прав и снятие администратора.
          - **Comment** — полный CRUD комментариев к постам каналов.
          - **Subscription** — получение, создание и удаление Webhook-подписок.

          Идентификаторы `int64` задаются строками, поэтому большие значения не теряют точность JavaScript. Для сложных вложений доступно поле **Attachments JSON**, а inline keyboard поддерживает актуальные кнопки MAX, включая `message`, `clipboard` и `open_app`.

          Официальный endpoint по умолчанию — `https://platform-api2.max.ru`. Сохранённое старое официальное значение `https://platform-api.max.ru` мигрирует автоматически; пользовательские Base URL остаются без изменений.

          Для сообщений нода сохраняет защитное поведение основной интеграции: при неподдерживаемом Markdown запрос один раз повторяется как plain text, а временная ошибка обработки медиа повторяется с ограниченной возрастающей задержкой.

          `GET /chats` намеренно не представлен: с июня 2026 года метод не поддерживается API. Для production-сценариев получения событий используется **Max Trigger** и Webhook; Long Polling не добавлен как отдельная production-нода.
          '''
          if '## Max API: расширенные операции' not in readme:
              readme_path.write_text(readme.rstrip() + '\n\n' + readme_section.strip() + '\n')

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text()
          agents_section = '''
          ## Max API node architecture

          The package publishes three user-facing nodes: the compatibility node `Max`, the webhook node `MaxTrigger`, and the extended REST node `MaxApiOperations`.

          `nodes/Max/MaxApiOperations.node.ts` owns resource/operation routing. `MaxApiOperationsDescription.ts` owns n8n UI metadata. `MaxApiRequest.ts` owns transport behavior, query serialization, Markdown fallback, media-processing retries, and structured `NodeApiError` propagation. Shared URL rules live in `MaxUrlUtils.ts`.

          Maintain these invariants:

          - Treat every MAX `int64` identifier as a string at the n8n boundary.
          - Normalize only the legacy official host `platform-api.max.ru` to `platform-api2.max.ru`; never rewrite a custom Base URL.
          - Normalize Webhook hostnames to Punycode before creating or deleting a subscription.
          - Preserve `false` and `0` query values; omit only `undefined`, `null`, and empty strings.
          - Reject recipient ID `0` locally with actionable guidance.
          - Retry `attachment.not.ready` responses with bounded backoff when a message contains media.
          - Retry an unsupported Markdown response once as readable plain text.
          - Rethrow `NodeApiError` unchanged so n8n retains the upstream status and API payload.
          - Every event offered by `MaxTriggerConfig` must be emitted by `MaxEventProcessor` with `event_context.is_supported: true` and regression coverage.
          - Do not commit temporary workflows that mutate or force-push the feature branch. Permanent CI runs for pull requests and pushes to `master`.
          '''
          if '## Max API node architecture' not in agents:
              agents_path.write_text(agents.rstrip() + '\n\n' + agents_section.strip() + '\n')

