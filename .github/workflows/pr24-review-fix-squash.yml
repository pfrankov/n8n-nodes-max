name: Upload verified PR 24 blobs

on:
  push:
    branches:
      - automation/pr24-review-fix-squash
    paths:
      - .github/workflows/pr24-review-fix-squash.yml

permissions:
  contents: write

concurrency:
  group: pr24-review-fix-squash
  cancel-in-progress: false

jobs:
  upload-blobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Reconstruct reviewed tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/pr24.patch.xz.b64
          for part in 00 01 02 03 04 05 06; do
            gh api "repos/${{ github.repository }}/contents/.github/pr24-xz-${part}?ref=automation/pr24-review-fix-squash" \
              --jq .content | tr -d '\n' | base64 --decode >> /tmp/pr24.patch.xz.b64
          done
          test "$(wc -c < /tmp/pr24.patch.xz.b64)" -eq 26584
          echo "6ae9a5a92ede969bc510d3827f18257c86c14517a475662552c3559fabdba7ef  /tmp/pr24.patch.xz.b64" | sha256sum --check
          base64 --decode /tmp/pr24.patch.xz.b64 > /tmp/pr24.patch.xz
          xz --decompress --stdout /tmp/pr24.patch.xz > /tmp/pr24.patch
          echo "1caa09a08259ac9154a9445d29296acbc7258e77fe7d373b9094f5a7959ed682  /tmp/pr24.patch" | sha256sum --check
          git apply --check /tmp/pr24.patch
          git apply --whitespace=error-all /tmp/pr24.patch
          for helper in MaxUrlUtils.ts MaxApiCompatibility.ts; do
            gh api "repos/${{ github.repository }}/contents/.github/pr24-${helper}?ref=automation/pr24-review-fix-squash" \
              --jq .content | tr -d '\n' | base64 --decode > "nodes/Max/${helper}"
          done
          find .github/workflows -maxdepth 1 -type f \
            ! -name ci.yml ! -name publish-npm.yml ! -name stale.yml -delete
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Upload all changed blobs with verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --soft origin/master
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 23
          : > blob-map.tsv
          while IFS= read -r -d '' path; do
            expected="$(git hash-object -- "$path")"
            payload="$(jq -n --rawfile content "$path" '{content: $content, encoding: "utf-8"}')"
            sha=''
            for attempt in 1 2 3 4 5; do
              echo "Uploading $path (attempt $attempt)"
              if sha="$(gh api --method POST "repos/${{ github.repository }}/git/blobs" \
                --input - --jq .sha <<<"$payload")"; then
                break
              fi
              sleep "$((attempt * 2))"
            done
            test -n "$sha"
            test "$sha" = "$expected"
            printf '%s\t%s\n' "$path" "$sha" >> blob-map.tsv
            sleep 1
          done < <(git diff --cached --name-only -z --diff-filter=ACMRT)
          test "$(wc -l < blob-map.tsv)" -eq 23

      - name: Upload blob map
        uses: actions/upload-artifact@v4
        with:
          name: pr24-final-blob-map
          path: blob-map.tsv
          if-no-files-found: error
          retention-days: 1
