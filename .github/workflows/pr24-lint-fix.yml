name: Finalize PR 24 lint compliance

on:
  push:
    branches:
      - feature/max-api-coverage-23
    paths:
      - .github/workflows/pr24-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/max-api-coverage-23
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply targeted lint-safe changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          description_path = Path('nodes/Max/MaxApiOperationsDescription.ts')
          text = description_path.read_text()

          marker = "\treturn {\n\t\tdisplayName: 'Operation',"
          replacement = "\treturn {\n\t\t// The default is derived from the resource-specific operation list.\n\t\t// eslint-disable-next-line n8n-nodes-base/node-param-default-missing\n\t\tdisplayName: 'Operation',"
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif replacement not in text:
              raise SystemExit('Operation property marker was not found')

          action_options = {
              "{ name: 'Sending Audio', value: 'sending_audio' },": "{ name: 'Sending Audio', value: 'sending_audio', action: 'Show sending audio' },",
              "{ name: 'Sending File', value: 'sending_file' },": "{ name: 'Sending File', value: 'sending_file', action: 'Show sending file' },",
              "{ name: 'Sending Photo', value: 'sending_photo' },": "{ name: 'Sending Photo', value: 'sending_photo', action: 'Show sending photo' },",
              "{ name: 'Sending Video', value: 'sending_video' },": "{ name: 'Sending Video', value: 'sending_video', action: 'Show sending video' },",
              "{ name: 'Typing', value: 'typing_on' },": "{ name: 'Typing', value: 'typing_on', action: 'Show typing' },",
          }
          for old, new in action_options.items():
              if old in text:
                  text = text.replace(old, new, 1)

          text = text.replace('typeOptions: { minValue: 1, maxValue: 100 },', 'typeOptions: { minValue: 1 },')
          member_limit = """\t\tdisplayOptions: {\n\t\t\tshow: {\n\t\t\t\tresource: ['chatMember'],\n\t\t\t\toperation: ['getMany'],\n\t\t\t\tmemberSelection: ['all'],\n\t\t\t},\n\t\t},\n\t\tdescription: 'Max number of results to return.',\n"""
          # n8n's Limit convention uses 50; MAX accepts up to 100.
          text = text.replace("\t\tdefault: 20,\n" + member_limit, "\t\tdefault: 50,\n" + member_limit, 1)

          text = text.replace("displayName: 'Video Token',", "displayName: 'Video Identifier',", 1)
          text = text.replace("name: 'videoToken',", "name: 'videoIdentifier',", 1)
          text = text.replace("description: 'The token of the attached video.',", "description: 'The identifier of the attached video.',", 1)
          text = text.replace("\t\tdescription: 'The comment ID.',\n", '', 1)
          description_path.write_text(text)

          operation_path = Path('nodes/Max/MaxApiOperations.node.ts')
          operation = operation_path.read_text().replace("'videoToken'", "'videoIdentifier'")
          operation_path.write_text(operation)

          test_path = Path('nodes/Max/tests/MaxApiOperations.node.test.ts')
          test = test_path.read_text().replace("videoToken", "videoIdentifier")
          test_path.write_text(test)
          PY

      - name: Apply n8n metadata autofixes
        run: npx eslint nodes/Max/MaxApiOperationsDescription.ts --fix

      - name: Format
        run: >-
          npx prettier --write
          nodes/Max/MaxApiOperations.node.ts
          nodes/Max/MaxApiOperationsDescription.ts
          nodes/Max/tests/MaxApiOperations.node.test.ts

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Verify package
        run: |
          npm pack --dry-run --json > /tmp/npm-pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const result = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0];
          const files = new Set(result.files.map(({ path }) => path));
          for (const entry of [...manifest.n8n.nodes, ...manifest.n8n.credentials]) {
            if (!files.has(entry)) throw new Error(`Missing npm entry point: ${entry}`);
          }
          NODE
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/pr24-lint-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          HUSKY=0 git commit -m "Привести интерфейс Max API к стандартам n8n"
          git push origin HEAD:feature/max-api-coverage-23
